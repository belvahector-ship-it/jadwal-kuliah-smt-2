<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <title>Kuliah S2 MTI</title>
  <meta name="description" content="Jadwal kuliah dan tugas S2 MTI 48 Reg.">
  <meta name="theme-color" content="#13305c">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S2</span>
        <div>
          <strong>Kuliah MTI 48</strong>
          <small id="semester-label"></small>
        </div>
      </div>
      <div class="clock" aria-label="Waktu sekarang (WIB)">
        <span id="clock-time">--.--</span>
        <small id="clock-date">&nbsp;</small>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="hero" class="hero"></div>

    <div class="section-head"><h2>Hari ini</h2></div>
    <div id="today-list" class="stack"></div>

    <div class="section-head"><h2>Tugas</h2></div>
    <div id="task-list" class="stack"></div>

    <div class="section-head"><h2>Jadwal mingguan</h2></div>
    <div id="week" class="week"></div>

    <div class="section-head"><h2>Mata kuliah</h2></div>
    <div id="courses" class="grid"></div>
  </main>

  <footer class="wrap footer">
    <small>Semua waktu dalam WIB</small>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
